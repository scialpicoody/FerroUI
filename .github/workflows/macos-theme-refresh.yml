name: Refresh macOS theme references

# Development-branch maintenance only. Never runs with write access for a PR,
# fork, arbitrary input ref, or main. Normal macos-theme.yml remains read-only.
on:
  push:
    branches: ['feat/macos26-theme']
    paths:
      - 'src/FerroUI.Themes.MacOS/**'
      - 'src/FerroUI.Base/animation/**'
      - 'src/FerroUI.Controls/toggle_switch.rs'
      - '.github/workflows/macos-theme-refresh.yml'

permissions:
  contents: read

concurrency:
  group: macos-theme-reference-refresh
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_BUILD_JOBS: 2
  RUST_BACKTRACE: 1

jobs:
  regenerate:
    if: github.repository == 'wieslawsoltes/FerroUI' && github.ref == 'refs/heads/feat/macos26-theme' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: macos-theme-reference-refresh
          cache-on-failure: true
      - name: Generate references with the actual runtime XAML compiler
        run: |
          cargo test --locked -p ferroui-themes-macos --lib \
            tests::compiled_xaml_tests::regenerate_compiled_xaml -- --ignored --exact \
            2>&1 | tee macos-theme-regenerate.log
          python3 scripts/macos-theme/audit.py --write
          python3 scripts/macos-theme/audit.py --check
      - name: Commit only generated references without overwriting concurrent work
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          files=(
            src/FerroUI.Themes.MacOS/compiled_xaml.rs
            src/FerroUI.Themes.MacOS/compiled_xaml.xamlmeta
            docs/porting/data/macos26-theme.json
          )
          git add -- "${files[@]}"
          if git diff --cached --quiet; then
            echo 'Generated references are already current.'
            exit 0
          fi
          remote_head="$(git ls-remote origin refs/heads/feat/macos26-theme | cut -f1)"
          if [[ "$remote_head" != "$EXPECTED_HEAD" ]]; then
            echo '::notice::The branch advanced; a later push will refresh its own references. No write performed.'
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'chore(macos-theme): regenerate compiled XAML and source audit'
          # A normal fast-forward push is the final concurrency check. Never force.
          git push origin HEAD:refs/heads/feat/macos26-theme
      - name: Full theme contracts including generated-reference equivalence
        run: |
          git rev-parse HEAD | tee macos-theme-tested-commit.txt
          cargo test --locked -p ferroui-themes-macos --lib -- --nocapture \
            2>&1 | tee macos-theme-tests.log
      - name: Platform preference lifecycle
        if: success() || failure()
        run: |
          cargo test --locked -p ferroui-base --lib platform::default_platform_settings::tests -- --nocapture \
            2>&1 | tee macos-theme-platform-tests.log
      - name: Validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-theme-reference-refresh
          path: |
            macos-theme-regenerate.log
            macos-theme-tests.log
            macos-theme-platform-tests.log
            macos-theme-tested-commit.txt
          if-no-files-found: warn
          retention-days: 14
